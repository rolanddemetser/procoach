<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProCoach Auto</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#07111f;
  color:white;
}
.app{
  max-width:430px;
  margin:auto;
  padding:16px;
}
.card{
  background:#162235;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}
h1{
  font-size:34px;
  margin:0;
}
.value{
  font-size:22px;
  margin-top:10px;
}
.status{
  text-align:center;
  font-size:34px;
  font-weight:900;
  padding:20px;
  border-radius:20px;
  margin-bottom:12px;
}
.go{background:#16a34a;}
.hold{background:#f59e0b;}
.recover{background:#ef4444;}
.text{
  font-size:22px;
  line-height:1.35;
  font-weight:800;
}
.detail{
  font-size:18px;
  color:#9aa4b2;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="app">

  <div class="card">
    <h1>ProCoach Auto</h1>
    <div id="date" class="value"></div>
  </div>

  <div class="card">
    <h1>Coach</h1>
    <div id="status" class="status hold">...</div>
    <div id="text" class="text"></div>
    <div id="detail" class="detail"></div>
  </div>

</div>

<script>

async function loadAndCoach(){
  try{
    const res = await fetch("procoach-data.json?v=" + Date.now());
    const d = await res.json();

    document.getElementById("date").innerText =
      new Date().toLocaleDateString("nl-BE");

    let score = 0;
    let attention = [];

    if(d.sleep >= 7) score++;
    if(d.bb >= 50) score++;
    if(d.tsb > -10) score++;
    if(d.rhr <= 60) score++;
    if(d.fatigue < d.fitness + 10) score++;

    if(d.bb < 40) attention.push("BB laag");
    if(d.tsb < -20) attention.push("TSB diep negatief");
    if(d.steps > 18000) attention.push("veel stappen");

    let label = "HOLD";
    let text = "Rustige dag → wandelen 30–45 min.";

    if(score >= 4 && attention.length === 0){
      label = "GO";
      text = "Sterke dag → trainen mogelijk.";
    }

    if(score <= 2 || attention.length >= 2){
      label = "RECOVER";
      text = "Herstel → wandelen + yoga.";
    }

    document.getElementById("status").innerText = label;
    document.getElementById("status").className = "status " + label.toLowerCase();
    document.getElementById("text").innerText = text;

    document.getElementById("detail").innerText =
      "Slaap " + d.sleep +
      " | BB " + d.bb +
      " | TSB " + d.tsb +
      " | Fatigue/Fitness " + d.fatigue + "/" + d.fitness +
      (attention.length ? " | " + attention.join(" + ") : "");

  }catch(e){
    document.getElementById("text").innerText = "Geen data gevonden";
  }
}

loadAndCoach();

</script>
</body>
</html>
