<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProCoach Sync</title>

<style>
body {
  font-family: -apple-system, sans-serif;
  background: #0f1b2e;
  color: white;
  margin: 0;
  padding: 20px;
}
.card {
  background: #1c2b3f;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
}
h1 { font-size: 28px; margin-bottom: 10px; }
input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  margin-bottom: 15px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  border-radius: 15px;
  border: none;
  font-size: 18px;
  margin-top: 10px;
}
.save { background: #2ecc71; color: white; }
.sync { background: #3498db; color: white; }

.result {
  font-size: 22px;
  text-align: center;
  padding: 15px;
  border-radius: 15px;
  margin-top: 10px;
}
.recover { background: #e74c3c; }
.hold { background: #f39c12; }
.go { background: #2ecc71; }
</style>
</head>

<body>

<div class="card">
<h1>ProCoach Sync</h1>

<input id="sleep" placeholder="Slaap (uren)">
<input id="rhr" placeholder="Rusthartslag">
<input id="bb" placeholder="Body Battery">
<input id="steps" placeholder="Stappen">
<input id="tsb" placeholder="Form / TSB">
<input id="fatigue" placeholder="Fatigue">
<input id="fitness" placeholder="Fitness">

<input id="weight" placeholder="Gewicht (optioneel)">
<input id="waist" placeholder="Buikomtrek (optioneel)">

<button class="save" onclick="analyse()">Opslaan & Analyse</button>
<button class="sync" onclick="syncData()">Sync vandaag</button>
</div>

<div class="card">
<h2>Coach</h2>
<div id="result">-</div>
</div>

<div class="card">
<h2>Dashboard</h2>
<div id="dashboard"></div>
</div>

<script>
const STORAGE = "pc_sync_test";

function analyse() {
  const d = {
    date: new Date().toISOString().slice(0,10),
    sleep: parseFloat(sleep.value),
    rhr: parseFloat(rhr.value),
    bb: parseFloat(bb.value),
    steps: parseFloat(steps.value),
    tsb: parseFloat(tsb.value),
    fatigue: parseFloat(fatigue.value),
    fitness: parseFloat(fitness.value),
    weight: weight.value,
    waist: waist.value
  };

  let score = 0;
  if(d.sleep > 7) score++;
  if(d.bb > 50) score++;
  if(d.tsb > -10) score++;
  if(d.fatigue < d.fitness) score++;

  let result = "HOLD";
  let cls = "hold";

  if(score >= 3) { result = "GO"; cls = "go"; }
  if(score <= 1) { result = "RECOVER"; cls = "recover"; }

  const el = document.getElementById("result");
  el.innerHTML = result;
  el.className = "result " + cls;

  save(d);
}

function save(d){
  let data = JSON.parse(localStorage.getItem(STORAGE) || "[]");

  data = data.filter(x => x.date !== d.date);
  data.push(d);

  localStorage.setItem(STORAGE, JSON.stringify(data));
  render();
}

function render(){
  let data = JSON.parse(localStorage.getItem(STORAGE) || "[]");

  let html = "";
  data.slice(-5).reverse().forEach(d => {
    html += `${d.date} | ${d.weight || "-"} kg | ${d.waist || "-"} cm<br>`;
  });

  document.getElementById("dashboard").innerHTML = html;
}

async function syncData() {
  try {
    const res = await fetch("procoach-data.json?v=" + Date.now());
    const j = await res.json();

    sleep.value = j.sleep || "";
    rhr.value = j.rhr || "";
    bb.value = j.bb || "";
    steps.value = j.steps || "";
    tsb.value = j.tsb || "";
    fatigue.value = j.fatigue || "";
    fitness.value = j.fitness || "";

    alert("Sync gelukt");
  } catch(e) {
    alert("Geen data gevonden (nog geen JSON bestand)");
  }
}

render();
</script>

</body>
</html>
