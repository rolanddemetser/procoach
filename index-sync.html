<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProCoach Sync V2</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#07111f;
  color:white;
}
.app{
  max-width:430px;
  margin:auto;
  padding:16px;
}
.card{
  background:#162235;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}
h1{
  margin:0;
  font-size:34px;
}
h2{
  font-size:30px;
  margin:0 0 16px;
}
.subtitle{
  color:#9aa4b2;
  margin-top:8px;
  font-size:18px;
  font-weight:700;
}
label{
  display:block;
  margin-top:14px;
  font-size:17px;
  color:#cbd5e1;
  font-weight:800;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:16px;
  border-radius:18px;
  border:none;
  font-size:22px;
  margin-top:6px;
  background:white;
  color:black;
}
button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  color:white;
  font-size:22px;
  font-weight:900;
  margin-top:18px;
}
.save{background:#22c55e;}
.sync{background:#0ea5e9;}
.status{
  text-align:center;
  font-size:34px;
  font-weight:900;
  padding:20px;
  border-radius:20px;
  margin-bottom:18px;
}
.go{background:#16a34a;}
.hold{background:#f59e0b;}
.recover{background:#ef4444;}
.coachtext{
  font-size:22px;
  line-height:1.35;
  font-weight:800;
}
.detail{
  color:#9aa4b2;
  font-size:18px;
  line-height:1.4;
  margin-top:14px;
}
.dashline{
  font-size:20px;
  line-height:1.45;
  margin-bottom:10px;
}
.note{
  color:#9aa4b2;
  font-size:15px;
  line-height:1.35;
}
</style>
</head>

<body>
<div class="app">

  <div class="card">
    <h1>ProCoach Sync</h1>
    <div class="subtitle" id="dateLabel"></div>
    <div class="note">Sync vult herstel- en trainingsdata. Gewicht en buik alleen invullen als ze wijzigen.</div>

    <label>Slaap</label>
    <input id="sleep" inputmode="decimal" placeholder="bv. 6,5">

    <label>Rusthartslag</label>
    <input id="rhr" inputmode="numeric">

    <label>Body Battery</label>
    <input id="bb" inputmode="numeric">

    <label>Stappen</label>
    <input id="steps" inputmode="numeric">

    <label>Form / TSB</label>
    <input id="tsb" type="number" placeholder="-28">

    <label>Fatigue</label>
    <input id="fatigue" inputmode="numeric">

    <label>Fitness</label>
    <input id="fitness" inputmode="numeric">

    <label>Gewicht</label>
    <input id="weight" inputmode="decimal" placeholder="alleen bij wijziging">

    <label>Buikomtrek</label>
    <input id="waist" inputmode="decimal" placeholder="alleen bij wijziging">

    <button class="sync" onclick="syncToday()">Sync vandaag</button>
    <button class="save" onclick="saveAndAnalyze()">Opslaan & Analyse</button>
  </div>

  <div class="card">
    <h2>Coach</h2>
    <div id="status" class="status hold">Nog geen analyse</div>
    <div id="coach" class="coachtext">Klik eerst op Sync vandaag of vul manueel in.</div>
    <div id="detail" class="detail"></div>
  </div>

  <div class="card">
    <h2>Dashboard</h2>
    <div id="dashboard" class="detail">Nog geen data.</div>
  </div>

</div>

<script>
const STORAGE = "pc_sync_v2";
const DEFAULT_WEIGHT = 84.5;
const DEFAULT_WAIST = 98;

let data = JSON.parse(localStorage.getItem(STORAGE) || "[]");

document.getElementById("dateLabel").innerText =
  new Date().toLocaleDateString("nl-BE", {
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  });

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function val(id){
  const el = document.getElementById(id);
  if(!el) return null;
  const raw = el.value.trim().replace(",",".");
  if(raw === "") return null;
  const n = Number(raw);
  return Number.isFinite(n) ? n : null;
}

function sleepValue(){
  let s = val("sleep");
  if(s === null) return null;
  if(s > 24) s = s / 10;
  return Math.round(s * 10) / 10;
}

function lastValue(key, fallback){
  for(let i=data.length-1; i>=0; i--){
    if(data[i][key] !== null && data[i][key] !== undefined && data[i][key] !== ""){
      return data[i][key];
    }
  }
  return fallback;
}

function fillField(id, value){
  if(value !== undefined && value !== null){
    document.getElementById(id).value = value;
  }
}

async function syncToday(){
  try{
    const response = await fetch("procoach-data.json?v=" + Date.now());
    if(!response.ok) throw new Error("bestand niet gevonden");

    const j = await response.json();

    fillField("sleep", j.sleep);
    fillField("rhr", j.rhr);
    fillField("bb", j.bb);
    fillField("steps", j.steps);
    fillField("tsb", j.tsb);
    fillField("fatigue", j.fatigue);
    fillField("fitness", j.fitness);

    alert("Sync gelukt");
  }catch(e){
    alert("Sync mislukt: procoach-data.json niet gevonden of fout formaat");
  }
}

function saveAndAnalyze(){
  const today = todayISO();

  const previousWeight = lastValue("weight", DEFAULT_WEIGHT);
  const previousWaist = lastValue("waist", DEFAULT_WAIST);

  const d = {
    date: today,
    sleep: sleepValue(),
    rhr: val("rhr"),
    bb: val("bb"),
    steps: val("steps"),
    tsb: val("tsb"),
    fatigue: val("fatigue"),
    fitness: val("fitness"),
    weight: val("weight") ?? previousWeight,
    waist: val("waist") ?? previousWaist
  };

  data = data.filter(x => x.date !== today);
  data.push(d);
  data.sort((a,b) => a.date.localeCompare(b.date));

  localStorage.setItem(STORAGE, JSON.stringify(data));

  analyze(d);
  renderDashboard();
}

function analyze(d){
  let score = 0;
  let attention = [];

  if(d.sleep !== null && d.sleep >= 7) score++;
  if(d.bb !== null && d.bb >= 50) score++;
  if(d.tsb !== null && d.tsb > -10) score++;
  if(d.rhr !== null && d.rhr <= 60) score++;
  if(d.fatigue !== null && d.fitness !== null && d.fatigue < d.fitness + 10) score++;

  if(d.bb !== null && d.bb < 40) attention.push("Body Battery laag");
  if(d.tsb !== null && d.tsb < -20) attention.push("TSB diep negatief");
  if(d.steps !== null && d.steps > 18000) attention.push("veel stappenbelasting");
  if(d.sleep !== null && d.sleep < 6) attention.push("korte slaap");

  let label = "HOLD";
  let text = "Rustige dag → wandelen 30–45 min in zone 2. Geen zware HASfit.";

  if(score >= 4 && attention.length === 0){
    label = "GO";
    text = "Sterke dag → HASfit kan + wandelen 45–60 min. Hou het gecontroleerd.";
  }

  if(score <= 2 || attention.length >= 2){
    label = "RECOVER";
    text = "Herstel → wandelen 20–40 min rustig + yoga. Geen krachttraining vandaag.";
  }

  document.getElementById("status").innerText = label;
  document.getElementById("status").className = "status " + label.toLowerCase();
  document.getElementById("coach").innerText = text;

  document.getElementById("detail").innerText =
    "Slaap " + (d.sleep ?? "-") + "u | BB " + (d.bb ?? "-") +
    " | TSB " + (d.tsb ?? "-") +
    " | Fatigue/Fitness " + (d.fatigue ?? "-") + "/" + (d.fitness ?? "-") +
    " | Gewicht " + d.weight + " kg | Buik " + d.waist + " cm" +
    (attention.length ? " | Aandacht: " + attention.join(" + ") : "");
}

function renderDashboard(){
  if(!data.length){
    document.getElementById("dashboard").innerText = "Nog geen data.";
    return;
  }

  let html = "";
  data.slice(-7).reverse().forEach(d => {
    html += "<div class='dashline'>" +
      d.date + " | " + d.weight + " kg | " + d.waist + " cm" +
      "</div>";
  });

  document.getElementById("dashboard").innerHTML = html;
}

renderDashboard();

if(data.length){
  analyze(data[data.length-1]);
}
</script>
</body>
</html>
