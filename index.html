<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProCoach</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#07111f;
  color:white;
}
.app{
  max-width:430px;
  margin:auto;
  padding:16px;
}
.card{
  background:#162235;
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
}
h1{font-size:28px;margin:0}
label{display:block;margin-top:10px}
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#22c55e;
  color:white;
  font-size:18px;
  margin-top:12px;
}
.status{
  text-align:center;
  font-size:26px;
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
}
.go{background:#16a34a}
.hold{background:#f59e0b}
.recover{background:#ef4444}
</style>
</head>

<body>
<div class="app">

<div class="card">
<h1>ProCoach</h1>
<div id="date"></div>

<label>Slaap</label>
<input id="sleep" placeholder="7.2">

<label>Rusthartslag</label>
<input id="rhr">

<label>Body Battery</label>
<input id="bb">

<label>Stappen</label>
<input id="steps">

<label>Form / TSB</label>
<input id="tsb" type="number" placeholder="-23">

<label>Fatigue</label>
<input id="fatigue">

<label>Fitness</label>
<input id="fitness">

<label>Gewicht</label>
<input id="weight">

<label>Buikomtrek</label>
<input id="waist">

<button onclick="save()">Opslaan</button>
</div>

<div class="card">
<h2>Coach</h2>
<div id="status" class="status">-</div>
<div id="coach"></div>
</div>

<div class="card">
<h2>Dashboard</h2>
<div id="dash"></div>
</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("pc")) || [];

document.getElementById("date").innerText =
new Date().toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"});

function val(id){
  let v=document.getElementById(id).value.replace(",",".");
  return v===""?null:Number(v);
}

function sleepFix(v){
  if(v>24) return v/10;
  return v;
}

function last(key){
  for(let i=data.length-1;i>=0;i--){
    if(data[i][key]!=null) return data[i][key];
  }
  return key=="weight"?84.5:98;
}

function save(){

let d={
  date:new Date().toISOString().slice(0,10),
  sleep:sleepFix(val("sleep")),
  rhr:val("rhr"),
  bb:val("bb"),
  steps:val("steps"),
  tsb:val("tsb"),
  fatigue:val("fatigue"),
  fitness:val("fitness"),
  weight:val("weight") ?? last("weight"),
  waist:val("waist") ?? last("waist")
};

data.push(d);
localStorage.setItem("pc",JSON.stringify(data));

analyze(d);
render();
}

function analyze(d){

let score=0;

if(d.sleep>=7) score++;
if(d.bb>=50) score++;
if(d.tsb>-10) score++;
if(d.rhr<=60) score++;
if(d.fatigue<d.fitness+10) score++;

let label="HOLD",txt="Rustig bewegen";

if(score>=4){label="GO";txt="Sterke dag → trainen mogelijk";}
if(score<=2){label="RECOVER";txt="Herstel → wandelen + yoga";}

document.getElementById("status").innerText=label;
document.getElementById("status").className="status "+label.toLowerCase();

document.getElementById("coach").innerText=
txt+" | BB "+d.bb+" | TSB "+d.tsb;
}

function render(){
let html="";
data.slice(-10).forEach(d=>{
html+=d.date+" | "+d.weight+"kg | "+d.waist+"cm<br>";
});
document.getElementById("dash").innerHTML=html;
}

render();

</script>

</body>
</html>
